name: hawades_masr
description: HawadesMasr incident management app (Flutter, Clean Architecture, Offline-first)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.4.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  workmanager: ^0.5.2
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  camera: ^0.11.0+1
  video_player: ^2.9.1
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  uuid: ^4.4.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^2.5.2

flutter:
  uses-material-design: true
